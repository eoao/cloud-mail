name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail-db"
database_id = "4dc8a98e-d99c-4b72-a3a4-c8a3e4d4421b"

[[kv_namespaces]]
binding = "kv"
id = "4adfd9e29efb4a7090cdbc2afc4fcf1d"

[[r2_buckets]]
binding = "r2"
bucket_name = "cloud-mail-r2"

[ai]
binding = "ai"

# Single-instance job queue drainer. SQLite-backed so it works on the free plan.
[[durable_objects.bindings]]
name = "JOB_RUNNER"
class_name = "JobRunner"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["JobRunner"]

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]
# trigger rebuild

[vars]
domain = ["dfmsolutions.de"]
admin = "info@dfmsolutions.de"

# Secrets - NEVER put these in [vars]; set them with `wrangler secret put <name>`:
#   jwt_secret     signs session tokens (rotating it logs everyone out)
#   init_secret    gates GET /api/init/<secret> (DB bootstrap + migrations)
#   webhook_secret Svix signing secret from the sending provider's webhook config
# Existing deployments keep their old plaintext jwt_secret because keep_vars = true;
# run `wrangler secret put jwt_secret` to shadow and replace it.

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
